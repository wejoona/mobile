# Codemagic CI/CD pipeline for Korido
workflows:
  korido-deploy:
    name: Korido - Build & Deploy
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Joonapay appstore

    environment:
      flutter: 3.44.2
      xcode: latest
      vars:
        APP_APPLE_ID: "6761443157"
      groups:
        - google_play_credentials
      ios_signing:
        certificates:
          - certificate: korido_dist_cert
        provisioning_profiles:
          - profile: korido_appstore
      android_signing:
        - joonapay-upload

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'staging'
          include: true

    scripts:
      - name: Installer les dépendances
        script: flutter pub get

      - name: Gate analyzer warnings
        script: |
          set +e
          dart analyze --format machine > analyze.txt
          ANALYZE_EXIT=$?
          set -e
          if grep -E '^(ERROR|WARNING)' analyze.txt; then
            echo "Analyzer errors/warnings found"
            exit 1
          fi
          if [ "$ANALYZE_EXIT" -gt 2 ]; then
            cat analyze.txt
            exit "$ANALYZE_EXIT"
          fi
          echo "Analyzer passed with no errors or warnings."

      - name: Run Flutter tests
        script: |
          find test -name '*_test.dart' \
            ! -path '*/golden/*' \
            ! -path '*/snapshots/*' \
            | sort > /tmp/korido_flutter_tests.txt
          xargs -n 40 flutter test < /tmp/korido_flutter_tests.txt

      - name: Configurer le signing iOS
        script: xcode-project use-profiles

      - name: Set iOS build number
        script: |
          cd $CM_BUILD_DIR/ios
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo 0)
          if [ -z "$LATEST" ]; then LATEST=0; fi
          NEW_BUILD_NUMBER=$(($LATEST + 1))
          echo "Latest: $LATEST -> New: $NEW_BUILD_NUMBER"
          agvtool new-version -all $NEW_BUILD_NUMBER

      - name: Build iOS (IPA)
        script: |
          cd $CM_BUILD_DIR/ios
          BUILD_NUMBER=$(agvtool what-version -terse)
          echo "Building with number: $BUILD_NUMBER"
          flutter build ipa --release \
            --dart-define-from-file="$CM_BUILD_DIR/env.staging.json" \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Setup Android signing
        script: |
          echo "storePassword=$CM_KEYSTORE_PASSWORD" > "$CM_BUILD_DIR/android/key.properties"
          echo "keyPassword=$CM_KEY_PASSWORD" >> "$CM_BUILD_DIR/android/key.properties"
          echo "keyAlias=$CM_KEY_ALIAS" >> "$CM_BUILD_DIR/android/key.properties"
          echo "storeFile=$CM_KEYSTORE_PATH" >> "$CM_BUILD_DIR/android/key.properties"

      - name: Build Android (AAB)
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          LATEST=$(google-play get-latest-build-number \
            --package-name "com.joonapay.usdc_wallet" \
            --tracks="internal" 2>/dev/null || echo 0)
          if [ -z "$LATEST" ]; then LATEST=0; fi
          BUILD_NUMBER=$(($LATEST + 1))
          echo "Building Android with number: $BUILD_NUMBER"

          {
            echo "flutter.buildMode=release"
            echo "flutter.versionName=1.0.0"
            echo "flutter.versionCode=$BUILD_NUMBER"
          } >> "$CM_BUILD_DIR/android/local.properties"

          ENV_DEFINE=$(printf 'ENV=staging' | base64 | tr -d '\n')
          API_DEFINE=$(printf 'API_URL=https://staging-korido-api.joonapay.com/api/v1' | base64 | tr -d '\n')
          DART_DEFINES="$ENV_DEFINE,$API_DEFINE"

          cd "$CM_BUILD_DIR/android"
          ./gradlew :app:bundleRelease \
            -Pdart-defines="$DART_DEFINES" \
            -Ptarget=lib/main.dart \
            -Ptarget-platform=android-arm,android-arm64,android-x64 \
            -Psplit-debug-info=build/symbols \
            --stacktrace

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
        changes_not_sent_for_review: true

      email:
        recipients:
          - augustin@joonapay.com
        notify:
          success: true
          failure: true
