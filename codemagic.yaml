# Codemagic CI/CD pipeline for Korido
workflows:
  korido-deploy:
    name: Korido - Build & Deploy
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      # Publishing requires all Apple agreements to be active for the account.
      app_store_connect: Joonapay appstore

    environment:
      flutter: 3.44.2
      xcode: latest
      vars:
        APP_APPLE_ID: "6761443157"
      groups:
        - google_play_credentials
      ios_signing:
        certificates:
          - certificate: korido_dist_cert
        provisioning_profiles:
          - profile: korido_appstore
      android_signing:
        - joonapay-upload

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'staging'
          include: true

    scripts:
      - name: Installer les dépendances
        script: flutter pub get

      - name: Hydrate Firebase config
        script: bash scripts/ensure_firebase_config.sh

      - name: Gate analyzer warnings
        script: |
          set +e
          dart analyze --format machine > analyze.txt
          ANALYZE_EXIT=$?
          set -e
          if grep -E '^(ERROR|WARNING)' analyze.txt; then
            echo "Analyzer errors/warnings found"
            exit 1
          fi
          if [ "$ANALYZE_EXIT" -gt 2 ]; then
            cat analyze.txt
            exit "$ANALYZE_EXIT"
          fi
          echo "Analyzer passed with no errors or warnings."

      - name: Run Flutter tests
        script: |
          find test -name '*_test.dart' \
            ! -path '*/golden/*' \
            ! -path '*/snapshots/*' \
            | sort > /tmp/korido_flutter_tests.txt
          xargs -n 40 flutter test < /tmp/korido_flutter_tests.txt

      - name: Configurer le signing iOS
        script: xcode-project use-profiles

      - name: Set iOS build number
        script: |
          set -euo pipefail
          cd $CM_BUILD_DIR/ios
          CM_SEQUENCE="${BUILD_NUMBER:-${PROJECT_BUILD_NUMBER:-}}"
          if ! [[ "$CM_SEQUENCE" =~ ^[0-9]+$ ]]; then
            echo "Codemagic did not provide a numeric BUILD_NUMBER or PROJECT_BUILD_NUMBER."
            exit 1
          fi

          LATEST=""
          if LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID"); then
            if ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then
              echo "App Store Connect returned a non-numeric build number: $LATEST"
              exit 1
            fi
          else
            echo "App Store build lookup failed; using the monotonic Codemagic sequence."
            LATEST=0
          fi

          STORE_NEXT=$((LATEST + 1))
          NEW_BUILD_NUMBER=$CM_SEQUENCE
          if [ "$STORE_NEXT" -gt "$NEW_BUILD_NUMBER" ]; then
            NEW_BUILD_NUMBER=$STORE_NEXT
          fi
          echo "App Store latest: $LATEST; Codemagic sequence: $CM_SEQUENCE; selected: $NEW_BUILD_NUMBER"
          agvtool new-version -all $NEW_BUILD_NUMBER

      - name: Build iOS (IPA)
        script: |
          cd $CM_BUILD_DIR/ios
          BUILD_NUMBER=$(agvtool what-version -terse)
          echo "Building with number: $BUILD_NUMBER"
          flutter build ipa --release \
            --dart-define-from-file="$CM_BUILD_DIR/env.staging.json" \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Validate and publish iOS to TestFlight
        script: |
          set -euo pipefail
          IPA_PATH="$CM_BUILD_DIR/build/ios/ipa/Korido.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "Expected IPA is missing: $IPA_PATH"
            find "$CM_BUILD_DIR/build/ios/ipa" -maxdepth 1 -type f -print || true
            exit 1
          fi
          app-store-connect publish \
            --path "$IPA_PATH" \
            --enable-package-validation \
            --testflight \
            --altool-verbose-logging \
            2>&1 | tee "$CM_BUILD_DIR/build/app-store-publish.log"

      - name: Setup Android signing
        script: |
          echo "storePassword=$CM_KEYSTORE_PASSWORD" > "$CM_BUILD_DIR/android/key.properties"
          echo "keyPassword=$CM_KEY_PASSWORD" >> "$CM_BUILD_DIR/android/key.properties"
          echo "keyAlias=$CM_KEY_ALIAS" >> "$CM_BUILD_DIR/android/key.properties"
          echo "storeFile=$CM_KEYSTORE_PATH" >> "$CM_BUILD_DIR/android/key.properties"

      - name: Build Android (AAB)
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          APPLICATION_ID=$(grep -E 'applicationId = "[^"]+"' "$CM_BUILD_DIR/android/app/build.gradle.kts" | head -1 | sed -E 's/.*applicationId = "([^"]+)".*/\1/')
          if [ -z "$APPLICATION_ID" ]; then
            echo "Could not resolve Android applicationId from build.gradle.kts"
            exit 1
          fi
          LATEST=$(google-play get-latest-build-number \
            --package-name "$APPLICATION_ID" \
            --tracks="internal" 2>/dev/null || echo 0)
          if [ -z "$LATEST" ]; then LATEST=0; fi
          BUILD_NUMBER=$(($LATEST + 1))
          echo "Building Android with number: $BUILD_NUMBER"
          APP_VERSION_NAME=$(grep '^version:' "$CM_BUILD_DIR/pubspec.yaml" | awk '{print $2}' | cut -d+ -f1)
          echo "Android version name: $APP_VERSION_NAME"

          printf '\nflutter.buildMode=release\nflutter.versionName=%s\nflutter.versionCode=%s\n' \
            "$APP_VERSION_NAME" "$BUILD_NUMBER" >> "$CM_BUILD_DIR/android/local.properties"

          ENV_DEFINE=$(printf 'ENV=staging' | base64 | tr -d '\n')
          API_DEFINE=$(printf 'API_URL=https://api.joonalabs.com/korido/v1' | base64 | tr -d '\n')
          SENTRY_DEFINE=$(printf 'SENTRY_DSN=https://e940855066e902eafd3bf67348d625e7@sentry.wejoona.com/7' | base64 | tr -d '\n')
          DART_DEFINES="$ENV_DEFINE,$API_DEFINE,$SENTRY_DEFINE"

          cd "$CM_BUILD_DIR/android"
          ./gradlew :app:bundleRelease \
            -Pdart-defines="$DART_DEFINES" \
            -Ptarget=lib/main.dart \
            -Ptarget-platform=android-arm,android-arm64,android-x64 \
            -Psplit-debug-info=build/symbols \
            --stacktrace

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/ios/ipa/*.ipa
      - build/app-store-publish.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
        changes_not_sent_for_review: true

      email:
        recipients:
          - augustin@joonapay.com
        notify:
          success: true
          failure: true
