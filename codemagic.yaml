# Codemagic CI/CD pipeline for Korido
workflows:
  korido-deploy:
    name: Korido - Build & Deploy
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Joonapay appstore

    environment:
      flutter: 3.41.6
      xcode: latest
      groups:
        - google_play_credentials
      ios_signing:
        certificates:
          - certificate: korido_dist_cert
        provisioning_profiles:
          - profile: korido_appstore
      android_signing:
        - joonapay-upload

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true

    scripts:
      - name: Installer les dépendances
        script: flutter pub get

      - name: Configurer le signing iOS
        script: xcode-project use-profiles

      - name: Build iOS (IPA)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number \
            --bundle-identifier "com.joonapay.usdcWallet" 2>/dev/null || echo 0)
          BUILD_NUMBER=$(($LATEST + 1))
          echo "iOS Build Number: $BUILD_NUMBER"
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Setup Android signing
        script: |
          echo "storePassword=$CM_KEYSTORE_PASSWORD" > "$CM_BUILD_DIR/android/key.properties"
          echo "keyPassword=$CM_KEY_PASSWORD" >> "$CM_BUILD_DIR/android/key.properties"
          echo "keyAlias=$CM_KEY_ALIAS" >> "$CM_BUILD_DIR/android/key.properties"
          echo "storeFile=$CM_KEYSTORE_PATH" >> "$CM_BUILD_DIR/android/key.properties"

      - name: Build Android (AAB)
        script: |
          BUILD_NUMBER=$(($(google-play get-latest-build-number \
            --package-name "com.joonapay.usdc_wallet" \
            --tracks="internal" 2>/dev/null || echo 0) + 1))
          flutter build appbundle --release \
            --build-number=$BUILD_NUMBER 2>&1 || {
            echo "Flutter CLI failed, falling back to Gradle directly..."
            cd android && ./gradlew bundleRelease
          }

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"

      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
        changes_not_sent_for_review: true

      email:
        recipients:
          - augustin@joonapay.com
        notify:
          success: true
          failure: true
