name: Accessibility Tests

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  accessibility-tests:
    name: Run Accessibility Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run accessibility tests
        run: flutter test test/accessibility/ --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: accessibility
          name: accessibility-coverage
          fail_ci_if_error: false

      - name: Check for semantic label regressions
        run: flutter analyze --no-fatal-infos

      - name: Generate accessibility report
        run: |
          echo "# Accessibility Test Results" > accessibility_report.md
          echo "" >> accessibility_report.md
          echo "## Test Summary" >> accessibility_report.md
          flutter test test/accessibility/ --reporter=json > test_results.json || true
          echo "" >> accessibility_report.md
          echo "## Coverage" >> accessibility_report.md
          echo "Coverage report uploaded to Codecov" >> accessibility_report.md

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('accessibility_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  contrast-check:
    name: Verify Contrast Ratios
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run contrast ratio tests
        run: flutter test test/accessibility/

  semantics-check:
    name: Check Semantic Labels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check for unlabeled elements
        run: |
          grep -R -n --include='*.dart' "GestureDetector\|InkWell" lib/ \
            | grep -v "Semantics\|semanticLabel" \
            | grep -v ".g.dart" \
            | tee semantic_label_candidates.txt || true
          echo "Semantic label candidates are informational until the existing backlog is triaged."

      - name: Check for missing alt text
        run: |
          grep -R -n --include='*.dart' "Image\." lib/ \
            | grep -v "Semantics\|ExcludeSemantics" \
            | grep -v ".g.dart" \
            | tee image_semantics_candidates.txt || true
          echo "Image semantics candidates are informational until the existing backlog is triaged."

  touch-target-check:
    name: Verify Touch Targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run touch target tests
        run: flutter test test/accessibility/ --name "Touch targets"
